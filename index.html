<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W4TCHA</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            color: #333;
        }
        .header-title {
            color: #0066cc;
            font-size: 28px;
            font-weight: bold;
        }
        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid #0066cc;
            object-fit: cover;
            margin: 20px auto;
        }
        h1 {
            font-size: 24px;
            margin-top: 10px;
        }
        p {
            font-size: 16px;
            margin: 5px 0;
        }
        .bio {
            font-style: italic;
            color: #666;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <!-- ชื่อหัวข้อด้านบนสุด -->
    <div class="header-title">W4TCHA</div>
    
    <p style="text-align: left; color: #666;">Markdown</p>

    <!-- รูปโปรไฟล์ (คุณสามารถเปลี่ยน url รูปภาพในเครื่องหมายคำพูดได้ในภายหลัง) -->
    <img src="https://placeholder.com" alt="Profile Image" class="profile-img">

    <!-- ข้อความทักทายและชื่อ -->
    <h1>💻 Hello World, I'm W4TCHA 👋</h1>

    <!-- ตำแหน่งหรือสถานะ -->
    <p><strong>Computer Engineering Student (Year 1)</strong></p>

    <!-- คำคมหรือสโลแกน -->
    <p class="bio">"Turning coffee into clean code & scalable systems."</p>

    <hr style="border: 0; border-top: 1px solid #ccc; margin: 30px 0;">
    
    <p style="text-align: left;">🙋‍♂️ About Me</p>

</body>
</html>
